services:
  postgres:
    image: postgres:16-alpine
    container_name: ridemesh-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ridemesh-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  location-service:
    build: ./location-service
    container_name: ridemesh-location-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/location_db
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ride-service:
    build: ./ride-service
    container_name: ridemesh-ride-service
    restart: always
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ride_db
      REDIS_URL: redis://redis:6379
      LOCATION_SERVICE_URL: http://location-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      location-service:
        condition: service_started

  match-service:
    build: ./match-service
    container_name: ridemesh-match-service
    restart: always
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      LOCATION_SERVICE_URL: http://location-service:3001
      RIDE_SERVICE_URL: http://ride-service:3002
    depends_on:
      location-service:
        condition: service_started
      ride-service:
        condition: service_started

volumes:
  postgres_data:
  redis_data:

